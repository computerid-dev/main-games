<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b1f17">
<title>Suit • 𝙽𝚈𝚛 𝙱°𝚝</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;background:#0b1f17;color:#e8fff1;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px 12px 18px;user-select:none;-webkit-user-select:none}
h1{font-size:19px;margin:2px 0;letter-spacing:.3px}
.sub{color:#8fbfa3;font-size:12px;margin:0 0 10px;text-align:center}
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.chip{background:#12301f;border:1px solid #1f4a31;border-radius:999px;padding:6px 12px;font-size:13px}
.chip b{color:#4ade80}
button{font:inherit;color:#e8fff1;background:#12301f;border:1px solid #1f4a31;border-radius:12px;padding:10px 16px;cursor:pointer}
button.on{background:#4ade80;color:#06210f;border-color:#4ade80;font-weight:700}
button:active{transform:scale(.97)}
.msg{min-height:24px;margin:8px 0;font-weight:600;text-align:center}
.tag{margin-top:auto;padding-top:18px;color:#8fbfa3;font-size:12px;letter-spacing:.6px}
.pick{display:flex;gap:10px;margin:10px 0}
.pick button{font-size:40px;padding:12px 18px;border-radius:16px}
.arena{font-size:44px;margin:8px 0;min-height:56px}
</style></head><body>
<h1>✊✌️✋ Suit</h1>
<p class="sub">Batu • Gunting • Kertas lawan bot</p>
<div class="bar"><span class="chip">Menang <b id="w">0</b></span><span class="chip">Seri <b id="d">0</b></span><span class="chip">Kalah <b id="l">0</b></span></div>
<div class="arena" id="arena">❔ vs ❔</div>
<div class="msg" id="msg">Pilih senjatamu!</div>
<div class="pick"><button id="p0">✊</button><button id="p1">✌️</button><button id="p2">✋</button></div>
<button id="reset">Reset Skor</button>
<div class="tag">@𝙽𝚈𝚛 𝙱°𝚝</div>
<script id="logic">
var PILIH=["batu","gunting","kertas"];
function judge(a,b){if(a===b)return "seri";
  return ((a==="batu"&&b==="gunting")||(a==="gunting"&&b==="kertas")||(a==="kertas"&&b==="batu"))?"menang":"kalah";}
</script>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var E={batu:"✊",gunting:"✌️",kertas:"✋"},sc={menang:0,seri:0,kalah:0};
function show(){$("w").textContent=sc.menang;$("d").textContent=sc.seri;$("l").textContent=sc.kalah}
function play(i){var me=PILIH[i],bot=PILIH[Math.floor(Math.random()*3)],r=judge(me,bot);sc[r]++;
  $("arena").textContent=E[me]+" vs "+E[bot];
  $("msg").textContent=r==="menang"?"Kamu menang! 🎉":r==="kalah"?"Bot menang 🤖":"Seri 🤝";show();}
for(var i=0;i<3;i++){(function(i){$("p"+i).onclick=function(){play(i)}})(i)}
$("reset").onclick=function(){sc={menang:0,seri:0,kalah:0};show();$("arena").textContent="❔ vs ❔";$("msg").textContent="Pilih senjatamu!"};
show();
})();
</script>
</body></html>
